<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    #loginbutton {
      position: absolute;
      padding: 15px 30px;
      cursor: pointer;
      margin-top: 25px;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div style="max-width: 400px; width: 100%;">
      <h1 class="text-center mb-5 display-4 fw-normal">Login</h1>
      <form onsubmit="alert('Login done!')">
        <div class="row mb-3 align-items-center">
          <label for="username" class="col-4 col-form-label">Username:</label>
          <div>
            <input class="form-control" type="text" id="username" v-model="username" required>
          </div>
        </div>
        <div class="row mb-3 align-items-center">
          <label for="password" class="col-4 col-form-label">Password:</label>
          <div>
            <input class="form-control" type="password" id="password" v-model="password" required>
          </div>
        </div>
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary" id="loginbutton">Login</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
    const btn = document.getElementById('loginbutton');

    btn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - btn.clientWidth);
      const y = Math.random() * (window.innerHeight - btn.clientHeight);

      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    });
  </script>
</body>
</html>
